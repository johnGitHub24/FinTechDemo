# =============================================================================
# FinTechDemo frontend — nginx site 設定
# 【職責】（1）提供 Vue SPA 靜態檔（2）把 /api/* 反代到 Docker 網路上的 gateway:8080
# 【技巧】nginx conf 用 # 註解；server { } 是虛擬主機區塊；location 依最長前綴匹配
# 【概念】SPA + API Gateway 經典模式：前端同源路徑 /api，實際轉到後端服務，瀏覽器不必知道 MS 埠
# =============================================================================

server {
    # 【技巧】listen 80：容器內 HTTP；對外映射由 compose／K8s 決定
    listen 80;
    # 【技巧】server_name _：萬用／預設 server（不依 Host 名分流）
    server_name _;

    # 【技巧】root／index：靜態檔根目錄（對應 Dockerfile COPY dist 的位置）
    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # /api/ → Spring Cloud Gateway
    # 【職責】所有 REST 呼叫走同一入口，由 gateway 再轉 order／account／risk
    # 【技巧】proxy_pass 結尾有 URI 路徑時，會替換 location 匹配到的前綴
    # 【概念】主機名 gateway 來自 docker-compose 的 service 名（內建 DNS）
    # -----------------------------------------------------------------------
    location /api/ {
        # 【技巧】http://gateway:8080/api/：compose 網路內解析；K8s 則常是 Service DNS
        proxy_pass http://gateway:8080/api/;
        # 【技巧】HTTP/1.1：較利於 keep-alive；部分上游也較穩
        proxy_http_version 1.1;
        # 【技巧】把原始 Host／客戶端 IP 傳給上游（日誌、限流、轉發鏈常用）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -----------------------------------------------------------------------
    # SPA fallback
    # 【職責】Vue Router history mode：重整 /orders 這類路徑時仍回 index.html
    # 【技巧】try_files：先找實體檔 → 目錄 → 最後 fallback 到 /index.html
    # 【概念】沒有這段，直接開深連結會 404（因為伺服器上沒有那個實體路徑）
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
