# =============================================================================
# FinTechDemo K8s — account-service Service
# 【職責】叢集內 DNS account-service:8084
# 【技巧】port／targetPort 對齊容器與 application.yml server.port
# 【概念】gateway 的 FINTECH_SERVICES_ACCOUNT_URL、order 的 account-url 都應指向這裡
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: account-service
  labels:
    app: account-service
spec:
  type: ClusterIP
  selector:
    app: account-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
