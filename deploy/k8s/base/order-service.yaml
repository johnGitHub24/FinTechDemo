# =============================================================================
# FinTechDemo K8s — order-service Service
# 【職責】叢集內 DNS：order-service:8081 → 選中的 order Pod
# 【技巧】name 常與 Deployment 同名，方便人類對照；真正關聯靠 selector 標籤
# 【概念】gateway／job 的 FINTECH_*_ORDER_URL 應指向此 Service，而非 Pod
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
