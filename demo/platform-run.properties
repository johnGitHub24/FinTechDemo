# FinTechDemo platform run-anywhere — Demo layer single source of truth
# Re-apply workspace: EngineeringOS/eos-minimal/hooks/apply-workspace.ps1 -WithDemo
# Pure (JDK/check): ../scripts/intellij-run.properties
#
# Keys are read by demo/platform-env.ps1; do not hardcode the same values in demo/*.ps1

# --- HTTP services (localhost bootRun / Compose) ---
GATEWAY_PORT=8080
ORDER_PORT=8081
RISK_PORT=8082
JOB_PORT=8083
ACCOUNT_PORT=8084
VITE_PORT=5173

# --- Infra (Compose / IntelliJ tools) ---
REDIS_HOST=127.0.0.1
REDIS_PORT=6379
H2_TCP_PORT=9093
H2_DB_NAME=fintechdemo
KAFKA_BROKER_PORT=9092

# --- DataGrip / H2 Console (order-service JVM must be running) ---
H2_JDBC_TCP=jdbc:h2:tcp://localhost:9093/mem:fintechdemo

# --- Kubernetes (kind full-stack demo) ---
# false＝只跑本機 bootRun／Vite（預設）；true＝開啟Demo.cmd 順便跑 start-k8s-demo.ps1
# Vue／npm 不能起叢集；此旗標由 demo/ensure-demo-links.ps1 讀取
ENABLE_K8S=false
K8S_CLUSTER=trading-local
K8S_CONTEXT=kind-trading-local
K8S_NAMESPACE=fintech-demo
K8S_OVERLAY=deploy/k8s/overlays/dev
K8S_KUBECONFIG_REL=demo/.tools/kubeconfig-kind-trading-local
K8S_TOOLS_REL=demo/.tools
K8S_TLS_INSECURE=true
K8S_GATEWAY_PF_LOCAL=18080
K8S_IMAGES=fintech-demo/gateway:local,fintech-demo/order-service:local,fintech-demo/risk-service:local,fintech-demo/account-service:local

# --- Docker / kind 平台（Run Anywhere：auto 依本機 Docker 偵測）---
# auto | linux/arm64 | linux/amd64 — ARM Mac/Windows 必須與 kind 節點一致，否則 ImagePullBackOff
DOCKER_BUILD_PLATFORM=auto
KIND_VERSION=0.27.0

# --- Docker cleanup patterns (ensure-demo-links / doctor) ---
DOCKER_HOSTILE_NAME_PATTERN=^(trading-local|tradingkubernetes|kind-)
