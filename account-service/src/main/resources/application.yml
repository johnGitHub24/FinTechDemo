# =============================================================================
# account-service — 預設 application.yml（local／test 基線）
# 【職責】帳務／持倉：H2、JWT、Redis 快取（本機 Demo 預設開）、Kafka（預設關）、Actuator
# 【技巧】本機 Demo 由 ensure-demo-links 先 docker compose up -d redis；測試 profile 再關 Redis
# 【概念】只有 account 連 :6379；order／risk／gateway／job 不連 Redis
# =============================================================================

server:
  port: 8084

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:h2:mem:accountdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
    tcp:
      # 【概念】同 JVM 開 TCP，IntelliJ／DataGrip 才能看到 mem 裡的表（測時關）
      # 【技巧】9094 避開 Kafka 9092、order H2 TCP 9093；URL：jdbc:h2:tcp://localhost:9094/mem:accountdb
      enabled: true
      port: 9094
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: fintech-account
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fintech.demo.common.event"
        # 【技巧】指定預設事件型別，簡化 consumer 反序列化
        spring.json.value.default.type: com.fintech.demo.common.event.TradeExecutedEvent
    listener:
      auto-startup: ${fintech.kafka.enabled:false}

app:
  jwt:
    # 【概念】與 order-service 同密鑰：跨服務驗證同一 JWT（Demo 簡化；正式可走 JWKS）
    secret: "fintech-demo-dev-secret-key-32bytes!!"
    expiration-ms: 86400000

fintech:
  kafka:
    enabled: false
  redis:
    # 【概念】本機 Demo 預設開；ensure 會先起 redis 容器。測試 application.properties 關掉。
    enabled: true
    ttl-seconds: 600
  job:
    token: demo-job-token

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
  endpoint:
    health:
      show-details: when_authorized

startup:
  info:
    enabled: true
    project-name: FinTechDemo Account
    frontend: none
    h2: true
    api-docs: true
    probe: true
